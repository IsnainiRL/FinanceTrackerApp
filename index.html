<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>

  <div class="tracker-app">

    <header class="tracker-header">
      <h1 class="tracker-header__title">Finance <span style="color:var(--accent-blue)">Tracker</span></h1>
      <div class="tracker-header__user">
        <div class="tracker-header__user-info">
          <span class="tracker-header__greeting" id="Username">Halo, <strong>Users</strong></span>
          <span class="tracker-header__date">Bulan Ini</span>
        </div>
        <div class="tracker-header__avatar" role="img" aria-label="Avatar Pengguna" aria-hidden="true">👤</div>
      </div>
    </header>

    <main>
      <section class="tracker-summary" aria-labelledby="summary-heading">
        <h2 id="summary-heading" class="visually-hidden">Ringkasan Keuangan</h2>

        <div class="tracker-summary__balance">
          <h3 class="tracker-summary__label">Saldo Saat Ini</h3>
          <p class="tracker-summary__balance-amount" id="balanceAmount">Rp 0</p>
        </div>

        <div class="tracker-summary__stat">
          <h3 class="tracker-summary__label">Pemasukan</h3>
          <p class="tracker-summary__stat-amount tracker-summary__stat-amount--income" id="incomeAmount">Rp 0</p>
        </div>

        <div class="tracker-summary__stat">
          <h3 class="tracker-summary__label">Pengeluaran</h3>
          <p class="tracker-summary__stat-amount tracker-summary__stat-amount--expense" id="expenseAmount">Rp 0</p>
        </div>
      </section>

      <section class="tracker-form-section" aria-labelledby="form-heading">
        <div class="tracker-form-section__card">
          <h2 id="form-heading" class="tracker-form-section__heading">Tambah Pencatatan Baru</h2>

          <form id="transactionForm" class="tracker-form">
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormTitleInput">Keterangan</label>
              <input type="text" id="transactionFormTitleInput" class="tracker-form__input" placeholder="Misal: Makan siang...">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormAmountInput">Nominal (Rp)</label>
              <input type="number" id="transactionFormAmountInput" class="tracker-form__input" placeholder="50000">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormDateInput">Tanggal</label>
              <input type="date" id="transactionFormDateInput" class="tracker-form__input">
            </div>
            <div class="tracker-form__field">
              <label class="tracker-form__label" for="transactionFormTypeSelect">Klasifikasi</label>
              <select id="transactionFormTypeSelect" class="tracker-form__input" style="appearance: none; background-image: url('https://img.icons8.com/ios-filled/50/expand-arrow--v1.png'); background-repeat: no-repeat; background-position: right 18px center; background-size: 16px;">
                <option value="income">Uang Masuk (+)</option>
                <option value="expense">Uang Keluar (-)</option>
              </select>
            </div>
            <button type="submit" class="tracker-form__submit">Simpan</button>
          </form>
        </div>
      </section>

      <section class="tracker-history" aria-labelledby="history-heading">
        <h2 id="history-heading" class="visually-hidden">Riwayat Transaksi</h2>

        <div class="tracker-search">
          <form id="searchTransactionForm" class="tracker-search__form" role="search">
            <input type="search" id="searchTransactionFormTitleInput" class="tracker-form__input" placeholder="Cari transaksi berdasarkan judul..." aria-label="Kata kunci pencarian transaksi">
            <button type="submit" class="tracker-search__submit" aria-label="Mulai Pencarian">Cari</button>
          </form>
        </div>

        <div class="tracker-history__grid">
          <div class="tracker-transaction-list">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pemasukan</h3>
            </div>
            <div id="incomeList" class="tracker-transaction-list__container">
            </div>
          </div>

          <div class="tracker-transaction-list">
            <div class="tracker-transaction-list__header">
              <h3 class="tracker-transaction-list__title">Arus Pengeluaran</h3>
            </div>
            <div id="expenseList" class="tracker-transaction-list__container">
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="tracker-footer">
      <p>&#169; 2026 Finance Tracker App</p>
    </footer>

  </div>

  <script src="./assets/scripts/main.js"></script>
</body>
</html>
